[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sabi"
version = "0.0.0"
description = "Test framework for sequential adaptive Bayesian inference algorithms."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andrew Roberts", email = "agr.roberts@gmail.com" }]

dependencies = [
  "jax>=0.8.1",
  "jaxlib>=0.8.1",
  "numpy>=1.26",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tinygp>=0.3",
  "optimistix>=0.0.7",
  "pyarrow>=16",
]

[project.optional-dependencies]
probpipe = ["probpipe"]
dev = ["pytest>=8", "pytest-xdist", "ruff>=0.5", "mypy>=1.10"]
wandb = ["wandb>=0.17"]
pyvbmc = ["pyvbmc"]
# gpjax-backed emulators (e.g. DSPGPEmulator). Pinned tight on the 0.14
# minor — gpjax 0.x has had API churn across minor versions, so any move
# off 0.14 should be a deliberate compatibility audit.
gpjax = ["gpjax>=0.14,<0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/sabi"]

[tool.uv.sources]
probpipe = { path = "../prob-pipe", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
